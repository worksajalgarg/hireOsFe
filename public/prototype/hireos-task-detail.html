<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HireOS Task Detail</title>
  <link rel="stylesheet" href="./hireos-pages.css?v=no-inbox-nav-v1" />
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
</head>
<body data-page="task-detail">
  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <div class="brand"><button class="brand-mark sidebar-logo-toggle" aria-label="HireOS" title="HireOS">H</button><div class="brand-copy"><strong>HireOS</strong><span>AI Hiring Operating System</span></div><button class="icon-button sidebar-toggle" aria-label="收起侧边栏" title="收起侧边栏"><i data-lucide="panel-left-close"></i></button></div>
      <div class="nav-section">Operate</div>
      <nav class="nav">
        <a class="nav-item" href="./hireos-dashboard-design.html"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></a>
        <a class="nav-item active" href="./hireos-tasks.html"><i data-lucide="list-checks"></i><span>Tasks</span><span class="count">4</span></a>
        <a class="nav-item" href="./hireos-jobs.html"><i data-lucide="briefcase-business"></i><span>Jobs</span><span class="count">12</span></a>
      </nav>
      <div class="sidebar-footer"><div class="user-status" role="button" tabindex="0" aria-expanded="false"><div class="avatar">LT</div><div class="user-copy"><strong>Linh Tran</strong><span><b></b> Online · HR Lead</span></div><button class="account-toggle" aria-label="账户菜单" title="账户菜单"><i data-lucide="chevron-up"></i></button></div><div class="account-menu"><button type="button"><i data-lucide="user-round"></i> Profile</button><button type="button"><i data-lucide="bell"></i> Notifications</button><div class="language-switch" aria-label="语言切换"><span>Language</span><div><button class="active" type="button">EN</button><button type="button">中文</button></div></div><button type="button"><i data-lucide="log-out"></i> Sign out</button></div></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="title-with-back"><a class="icon-button" href="./hireos-tasks.html" aria-label="Back to Tasks" title="Back to Tasks"><i data-lucide="arrow-left"></i></a><div class="page-title" data-task-detail-title></div></div>
        <div class="top-actions" data-task-detail-actions></div>
      </header>
      <section class="page-content" data-task-detail></section>
    </main>
    <aside class="agent" aria-label="Agent 对话区"><header class="agent-header"><div class="agent-title"><div class="agent-orb"><i data-lucide="sparkles"></i></div><div><strong>Task AI Workspace</strong><span>Context, evidence, action</span></div></div><button class="icon-button agent-toggle" aria-label="收起 Agent" title="收起 Agent"><i data-lucide="panel-right-close"></i></button></header><div class="agent-body" data-task-agent></div><footer class="agent-compose"><div class="compose-box"><input aria-label="向 Agent 提问" placeholder="Ask about this task..." /><button class="icon-button" aria-label="发送"><i data-lucide="send-horizontal"></i></button></div></footer></aside>
    <div class="agent-dock" aria-label="Agent 快捷输入"><button class="agent-dock-bar" type="button"><i data-lucide="sparkles"></i><span>Ask HireOS Agent about this task...</span><i data-lucide="send-horizontal"></i></button><div class="agent-dock-prompts"><button type="button">Summarize risks</button><button type="button">Suggest next action</button><button type="button">Show evidence gaps</button></div></div>
  </div>
  <script src="./hireos-tasks-data.js"></script>
  <script src="./hireos-pages.js?v=no-inbox-nav-v1"></script>
</body>
</html>
